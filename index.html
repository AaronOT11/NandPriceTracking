<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>TOPDISK 采购系统｜价格分析</title>
  <style>
    :root{--red:#d71920;--ink:#1f1f1f;--muted:#70757d;--line:#e5e6eb;--bg:#f5f6f8}*{box-sizing:border-box}html{background:#e9eaed}body{margin:0;color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9eaed}button,select{font:inherit;color:inherit}.phone{width:390px;min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 30px #161a2215}.nav-shell{position:sticky;top:0;z-index:10;background:#fff}.top{height:56px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand,.top-right{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}.brand-logo{width:86px;height:28px;object-fit:contain;object-position:left center}.system-name{border-left:1px solid #dedfe2;padding-left:9px;white-space:nowrap;font-size:13px}.avatar{width:30px;height:30px;border-radius:50%;background:#25282d;color:#fff;display:grid;place-items:center;font-size:12px}.more{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer}.subnav{display:flex;gap:19px;height:43px;padding:0 16px;overflow-x:auto;border-bottom:1px solid #e5e6eb;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}.subnav button{position:relative;flex:0 0 auto;border:0;background:transparent;color:#777c83;font-size:12px;padding:0;cursor:pointer}.subnav button.active{color:#1f1f1f;font-weight:700}.subnav button.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red);border-radius:3px 3px 0 0}.module-toast{position:fixed;top:112px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:80;background:#25282d;color:#fff;padding:9px 13px;border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.module-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.wrap{padding:24px 14px 40px}.intro{padding:0 2px 17px}.eyebrow{color:var(--red);font-size:9px;letter-spacing:1.45px;font-weight:700;margin:0 0 8px}.intro h1{font-size:24px;line-height:1.28;letter-spacing:-.7px;margin:0}.intro p:last-child{color:var(--muted);font-size:13px;margin:6px 0 0}.filter-entry{width:100%;border:1px solid #e1e2e6;background:#fff;min-height:68px;border-radius:12px;padding:12px;display:grid;grid-template-columns:38px 1fr 20px;gap:10px;align-items:center;text-align:left;cursor:pointer}.filter-icon{width:38px;height:38px;border-radius:10px;background:#fff1f0;color:var(--red);display:grid;place-items:center;font-size:20px}.filter-entry b{display:block;font-size:15px}.filter-entry small{display:block;font-size:11px;color:#83878e;margin-top:4px}.arrow{color:#999;font-size:20px}.summary{min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 11px;margin:9px 0 18px;background:#fbe9e9;border-radius:8px;font-size:11px;color:#7a292c}.summary span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary button{border:0;background:transparent;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;padding:10px}.module{background:#fff;border:1px solid #e6e7ea;border-radius:14px;padding:16px 14px;margin-bottom:14px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:15px}.head h2{font-size:18px;line-height:1.2;margin:0}.head p{font-size:11px;margin:5px 0 0;color:#858a92}.select{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 8px;font-size:11px}.count{display:flex;justify-content:space-between;color:#4c5159;font-size:11px;padding:0 1px 9px}.count span{font-size:9px;color:#a0a4aa}.cards{display:flex;flex-direction:column;gap:9px}.card{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;text-align:left;cursor:pointer}.card:active{transform:scale(.99)}.card-top{display:flex;justify-content:space-between}.card-top strong{font-size:14px}.card-top time{font-size:10px;color:#8b9096}.spec{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:11px}.spec i{width:3px;height:3px;border-radius:50%;background:#aaa}.tag{margin-left:auto;color:var(--red);background:#fff1f0;padding:3px 6px;border-radius:4px;font-size:9px}.pair{color:#6f747b;font-size:10px;margin:7px 0 12px}.prices{border-top:1px solid #f0f1f3;padding-top:11px;display:grid;grid-template-columns:1fr 1fr 22px;gap:8px;align-items:center}.prices span{font-size:10px;color:#7b8087}.prices b{display:block;color:#202124;font-size:17px;margin-top:3px}.prices span:first-child b{color:var(--red)}.all{text-align:center;color:#aaa;font-size:10px;margin:12px 0 0}.label{display:block;font-size:10px;color:#777c83;font-weight:700;margin:13px 0 7px}.wide-select{width:100%;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 11px;font-size:12px}.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#f1f2f4;padding:3px;border-radius:9px;height:38px}.seg button{border:0;border-radius:7px;background:transparent;color:#6d7279;font-size:11px;cursor:pointer}.seg button.active{background:#fff;color:var(--red);font-weight:700;box-shadow:0 1px 4px #1e22281a}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.metric{background:#fafafa;border:1px solid #ececef;border-radius:10px;padding:11px}.metric small{color:#737880;font-size:9px}.metric strong{display:block;font-size:20px;margin:6px 0 4px}.metric:first-child strong{color:var(--red)}.metric p{margin:0;font-size:9px;color:#92969c;white-space:nowrap}.chart-head{display:flex;justify-content:space-between;margin:20px 2px 8px;font-size:9px;color:#777}.legend{display:flex;gap:12px}.legend span:before{content:"";display:inline-block;width:12px;height:2px;background:#3e4650;vertical-align:middle;margin-right:5px}.legend span:first-child:before{background:var(--red)}.chartbox{position:relative;padding-top:38px}.tip{position:absolute;top:0;right:4px;background:#272b31;color:#fff;border-radius:6px;padding:6px 8px;font-size:8px;display:flex;gap:7px}.tip .low{color:#ff999d}.chart{width:100%;height:auto}.chart text{font-size:7px;fill:#92969d}.dot{cursor:pointer}.note{margin:3px 0 0;color:#979ba2;font-size:9px;line-height:1.5;padding:9px 10px;background:#f7f7f8;border-radius:7px}.overlay{position:fixed;inset:0;background:#10121675;z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(390px,100%);max-height:83vh;background:#fff;border-radius:18px 18px 0 0;overflow:hidden;animation:up .22s ease}.grab{width:34px;height:4px;background:#d9dadd;border-radius:3px;margin:8px auto 2px}.sheet-title{height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee}.sheet-title h3{font-size:16px;margin:0}.close{border:0;background:transparent;font-size:22px;cursor:pointer}.sheet-body{padding:4px 17px 18px;max-height:calc(83vh - 112px);overflow:auto}.group{margin:17px 0}.group-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px}.group-head small{font-size:9px;color:#aaa;font-weight:400}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{min-width:72px;border:1px solid #e5e6e9;background:#f8f8f9;border-radius:7px;padding:8px 11px;font-size:11px;cursor:pointer}.choices button.on{color:var(--red);border-color:#e98689;background:#fff1f0;font-weight:700}.choices button:disabled{color:#b8bbc1;border-color:#eceef1;background:#edeff2;cursor:not-allowed;opacity:.72}.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid #eee}.sheet-actions button{height:44px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}.reset{background:#fff;border:1px solid #ddd}.apply{background:var(--red);border:1px solid var(--red);color:#fff}.detail{padding:10px 17px 28px}.detail-price{background:#fff4f3;border-radius:10px;padding:13px;display:flex;justify-content:space-between;align-items:center}.detail-price span{font-size:10px;color:#83595a}.detail-price b{font-size:25px;color:var(--red)}dl{margin:12px 0 0}dl div{min-height:39px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f1f2;font-size:12px}dt{color:#858990}dd{margin:0;font-weight:600}@keyframes up{from{transform:translateY(30px);opacity:.5}}@media(max-width:390px){.phone{width:100%;box-shadow:none}}@media(min-width:700px){body{padding:20px 0}.phone{border-radius:18px;overflow:clip;min-height:calc(100vh - 40px)}.sheet{margin-bottom:20px;border-radius:18px}}
  </style>
</head>
<body>
<main class="phone">
  <header class="nav-shell">
    <nav class="top"><div class="brand"><img class="brand-logo" src="https://napandlucky.github.io/topdisk-website/topdisk-logo.svg" alt="TOPDISK — Memory and More"><span class="system-name">采购系统</span></div><div class="top-right"><span class="avatar">Z</span><button class="more">•••</button></div></nav>
    <nav class="subnav" aria-label="采购系统模块"><button class="active">价格分析</button><button onclick="futureModule('库存')">库存</button><button onclick="futureModule('采购量')">采购量</button><button onclick="futureModule('需求预测')">需求预测</button><button onclick="futureModule('销售')">销售</button></nav>
  </header>
  <div class="module-toast" id="moduleToast"></div>
  <div class="wrap">
    <section class="intro"><p class="eyebrow">PROCUREMENT INTELLIGENCE</p><h1>采购价格管理与分析</h1><p>查看供应商报价和历史价格变化</p></section>
    <button class="filter-entry" onclick="openFilter()"><span class="filter-icon">≡</span><span><b>筛选规格</b><small>选择产品、容量、速度和供应商</small></span><span class="arrow">›</span></button>
    <div class="summary"><span id="summary">T Card / 128GB / U3 / 全部供应商</span><button onclick="openFilter()">修改</button></div>
    <section class="module">
      <div class="head"><div><h2>报价明细</h2><p>查看近期供应商报价记录</p></div><select class="select"><option>本周</option><option>近 30 天</option><option>自定义</option></select></div>
      <div class="count"><span id="countText">共 5 条报价</span><span>价格更新时间：今天 14:30</span></div>
      <div class="cards" id="cards"></div><p class="all">已显示全部报价</p>
    </section>
    <section class="module">
      <div class="head"><div><h2>价格趋势</h2><p>查看当前规格的最低价和平均价变化</p></div></div>
      <label class="label">趋势周期</label><select class="wide-select"><option>近 3 个月</option><option>近 6 个月</option><option selected>近 1 年</option><option>近 2 年</option><option>自定义</option></select>
      <label class="label">价格口径</label><div class="seg" id="currency"><button class="active" data-value="cny">含税价</button><button data-value="usd">美金价</button></div>
      <label class="label">聚合方式</label><div class="seg" id="agg"><button>日</button><button class="active">周</button><button>月</button></div>
      <div class="metrics"><article class="metric"><small>周期最低价</small><strong id="minMetric">¥67.50</strong><p>供应商 A · 07-18</p></article><article class="metric"><small>周期平均价</small><strong id="avgMetric">¥69.64</strong><p>基于 24 条有效报价</p></article></div>
      <div class="chart-head"><div class="legend"><span>最低价</span><span>平均价</span></div><span id="aggText">按周聚合</span></div>
      <div class="chartbox"><div class="tip"><b>07/13</b><span class="low" id="tipMin">最低 ¥67.50</span><span id="tipAvg">平均 ¥69.64</span></div>
        <svg class="chart" viewBox="0 0 310 150" aria-label="价格趋势折线图">
          <g stroke="#eceef1"><line x1="20" y1="28" x2="296" y2="28"/><line x1="20" y1="67" x2="296" y2="67"/><line x1="20" y1="106" x2="296" y2="106"/></g>
          <polyline points="24,36 76,47 128,61 180,73 232,86 284,94" fill="none" stroke="#3e4650" stroke-width="2.2"/>
          <polyline points="24,52 76,62 128,76 180,90 232,106 284,124" fill="none" stroke="#d71920" stroke-width="2.8"/>
          <g fill="#fff" stroke="#d71920" stroke-width="2.5"><circle class="dot" cx="24" cy="52" r="3.5"/><circle class="dot" cx="76" cy="62" r="3.5"/><circle class="dot" cx="128" cy="76" r="3.5"/><circle class="dot" cx="180" cy="90" r="3.5"/><circle class="dot" cx="232" cy="106" r="3.5"/><circle class="dot" cx="284" cy="124" r="4.5"/></g>
          <g text-anchor="middle"><text x="24" y="145">05/04</text><text x="76" y="145">05/18</text><text x="128" y="145">06/01</text><text x="180" y="145">06/15</text><text x="232" y="145">06/29</text><text x="284" y="145">07/13</text></g>
        </svg>
      </div><p class="note">趋势仅基于系统内已录入报价，不代表完整市场价格指数。</p>
    </section>
  </div>
</main>
<div class="overlay" id="filterOverlay" onclick="backdrop(event,'filterOverlay')"><section class="sheet"><div class="grab"></div><div class="sheet-title"><h3>筛选规格</h3><button class="close" onclick="closeOverlay('filterOverlay')">×</button></div><div class="sheet-body" id="filterBody"></div><div class="sheet-actions"><button class="reset" onclick="resetFilters()">重置</button><button class="apply" onclick="applyFilters()">查看结果</button></div></section></div>
<div class="overlay" id="detailOverlay" onclick="backdrop(event,'detailOverlay')"><section class="sheet"><div class="grab"></div><div class="sheet-title"><h3>报价详情</h3><button class="close" onclick="closeOverlay('detailOverlay')">×</button></div><div class="detail" id="detail"></div></section></div>
<script>
const data=[
 {supplier:'供应商 A',date:'2026-07-18',product:'T Card',capacity:'128GB',speed:'U3',pair:'AY2705 + 0T26',cny:67.50,usd:8.83},
 {supplier:'供应商 B',date:'2026-07-17',product:'T Card',capacity:'128GB',speed:'U3',pair:'YS6285 + 3DV8',cny:69.20,usd:9.05},
 {supplier:'供应商 C',date:'2026-07-16',product:'T Card',capacity:'128GB',speed:'U3',pair:'AY2705 + SSV6',cny:70.80,usd:9.26},
 {supplier:'供应商 A',date:'2026-07-15',product:'T Card',capacity:'128GB',speed:'U3',pair:'YS6285 + 0T25',cny:68.60,usd:8.97},
 {supplier:'供应商 D',date:'2026-07-14',product:'T Card',capacity:'128GB',speed:'U3',pair:'CBM + 3DV7',cny:72.10,usd:null},
 {supplier:'供应商 A',date:'2026-07-18',product:'T Card',capacity:'64GB',speed:'U3',pair:'AY2705 + 3DV7',cny:42.38,usd:5.53},
 {supplier:'供应商 B',date:'2026-07-18',product:'PCBA 3.0',capacity:'128GB',speed:'G2',pair:'3379 + B47R',cny:74.40,usd:9.73}
];
const options={product:['T Card','PCBA 3.0','UDP','MUDP','SSD'],capacity:['32GB','64GB','128GB','256GB','512GB','1TB'],speed:['C10','U1','U3','U4','G2'],supplier:['全部供应商','供应商 A','供应商 B','供应商 C','供应商 D']};
const labels={product:'产品',capacity:'容量',speed:'速度',supplier:'供应商'};let filters={product:'T Card',capacity:'128GB',speed:'U3',supplier:'全部供应商'},draft={...filters};
function renderCards(){const rows=data.filter(x=>x.product===filters.product&&x.capacity===filters.capacity&&x.speed===filters.speed&&(filters.supplier==='全部供应商'||x.supplier===filters.supplier));const min=Math.min(...rows.map(x=>x.cny));document.getElementById('countText').textContent=`共 ${rows.length} 条报价`;document.getElementById('summary').textContent=Object.values(filters).join(' / ');document.getElementById('cards').innerHTML=rows.length?rows.map((x,i)=>`<button class="card" onclick="openDetail(${data.indexOf(x)})"><div class="card-top"><strong>${x.supplier}</strong><time>${x.date}</time></div><div class="spec"><span>${x.product}</span><i></i><span>${x.capacity}</span><i></i><span>${x.speed}</span>${x.cny===min?'<em class="tag">含税最低</em>':''}</div><div class="pair">搭配：${x.pair}</div><div class="prices"><span>含税价<b>¥${x.cny.toFixed(2)}</b></span><span>美金价<b>${x.usd===null?'—':'$'+x.usd.toFixed(2)}</b></span><span>›</span></div></button>`).join(''):'<div style="text-align:center;padding:42px 10px;color:#888;font-size:12px">暂无符合条件的报价<br><small>请修改筛选规格</small></div>'}
const filterOrder=['product','capacity','speed','supplier'];
function available(k,v){const prior=filterOrder.slice(0,filterOrder.indexOf(k));const rows=data.filter(x=>prior.every(p=>p==='supplier'||draft[p]===x[p]));return k==='supplier'?(v==='全部供应商'?rows.length>0:rows.some(x=>x.supplier===v)):rows.some(x=>x[k]===v)}
function reconcileAfter(k){const start=filterOrder.indexOf(k)+1;filterOrder.slice(start).forEach(next=>{const enabled=options[next].filter(v=>available(next,v));if(!enabled.includes(draft[next]))draft[next]=next==='supplier'&&enabled.includes('全部供应商')?'全部供应商':enabled[0]})}
function renderFilter(){document.getElementById('filterBody').innerHTML=Object.keys(options).map(k=>`<div class="group"><div class="group-head"><span>${labels[k]}</span><small>${k==='supplier'?'可选择全部':'单选 · 必选'}</small></div><div class="choices">${options[k].map(v=>{const enabled=available(k,v);return `<button class="${draft[k]===v?'on':''}" ${enabled?'':'disabled aria-disabled="true" title="当前条件下暂无数据"'} onclick="choose('${k}','${v}')">${v}</button>`}).join('')}</div></div>`).join('')}
function openFilter(){draft={...filters};reconcileAfter('product');renderFilter();document.getElementById('filterOverlay').classList.add('show')}function choose(k,v){if(!available(k,v))return;draft[k]=v;reconcileAfter(k);renderFilter()}function resetFilters(){draft={product:'T Card',capacity:'128GB',speed:'U3',supplier:'全部供应商'};reconcileAfter('product');renderFilter()}function applyFilters(){filters={...draft};renderCards();closeOverlay('filterOverlay')}
function openDetail(i){const x=data[i];document.getElementById('detail').innerHTML=`<div class="detail-price"><span>含税报价</span><b>¥${x.cny.toFixed(2)}</b></div><dl>${[['报价日期',x.date],['供应商',x.supplier],['产品',x.product],['容量',x.capacity],['速度',x.speed],['搭配',x.pair],['美金价',x.usd===null?'—':'$'+x.usd.toFixed(2)]].map(v=>`<div><dt>${v[0]}</dt><dd>${v[1]}</dd></div>`).join('')}</dl>`;document.getElementById('detailOverlay').classList.add('show')}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}function backdrop(e,id){if(e.target.id===id)closeOverlay(id)}
let moduleToastTimer;
function futureModule(name){const toast=document.getElementById('moduleToast');toast.textContent=`${name}模块规划中`;toast.classList.add('show');clearTimeout(moduleToastTimer);moduleToastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
document.querySelectorAll('#currency button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#currency button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const usd=b.dataset.value==='usd';document.getElementById('minMetric').textContent=usd?'$8.82':'¥67.50';document.getElementById('avgMetric').textContent=usd?'$9.10':'¥69.64';document.getElementById('tipMin').textContent=usd?'最低 $8.82':'最低 ¥67.50';document.getElementById('tipAvg').textContent=usd?'平均 $9.10':'平均 ¥69.64'});
document.querySelectorAll('#agg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#agg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('aggText').textContent='按'+b.textContent+'聚合'});renderCards();
</script>
</body></html>
